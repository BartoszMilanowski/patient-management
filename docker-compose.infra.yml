services:
  patient_db:
    container_name: patient-db
    image: postgres:17
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d patient_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - patient-network

networks:
  patient-network:
    name: patient-network